<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>앱 구동 스모크 테스트</title>
<style>body{font:15px/1.6 system-ui;padding:24px}.pass{color:#0a7d32}.fail{color:#c0182b}</style></head>
<body>
<!-- 실제 index.html의 DOM 구조를 그대로 담아, 모든 모듈이 오류 없이 초기화되고
     게임 루프가 끝까지 도는지 확인한다. app.js는 window.__SF로 상태를 노출한다. -->
<div id="out"></div>

<!-- index.html의 화면 골격 (app.js가 참조하는 id만 최소로) -->
<div id="app">
  <section id="screen-menu" class="screen active">
    <button class="btn-mode" data-mode="stage"></button>
    <button class="btn-mode" data-mode="practice"></button>
    <button class="btn-mode" data-mode="challenge"></button>
    <button class="btn-mode" data-mode="teacher"></button>
  </section>
  <section id="screen-setup" class="screen">
    <div id="setup-maps"></div><div id="setup-diffs"></div>
    <span id="setup-title"></span><p id="setup-diff-desc"></p><div id="setup-map-group"></div>
    <button data-back="menu"></button><button id="btn-start-game"></button>
  </section>
  <section id="screen-game" class="screen">
    <span id="hud-map"></span><span id="hud-env"></span><b id="hud-score"></b><b id="hud-shots"></b>
    <canvas id="stage" width="960" height="540"></canvas>
    <div id="feedback-bubble" hidden></div>
    <span id="angle-val"></span><input type="range" id="angle" min="10" max="80" value="45">
    <span id="power-val"></span><input type="range" id="power" min="1" max="100" value="50">
    <div id="proj-buttons"></div><span id="proj-desc"></span>
    <button id="btn-fire"></button><button id="btn-predict" hidden></button>
    <button id="btn-quit"></button><button id="btn-retry-map" hidden></button>
    <div id="teacher-panel" hidden></div>
    <select id="t-wind"><option value="0"></option><option value="right"></option></select>
    <select id="t-fric"><option value="1"></option></select>
    <select id="t-air"><option value="0"></option></select>
  </section>
</div>
<div class="modal" id="modal-result" hidden><span id="result-title"></span><span id="result-score"></span>
  <ul id="result-rows"></ul><div id="result-concept"></div><div id="result-actions"></div></div>
<div class="modal" id="modal-final" hidden><span id="final-title"></span><span id="final-score"></span>
  <p id="final-summary"></p><div id="rank-register"><input id="nick-input"></div>
  <button id="btn-register"></button><button id="btn-final-menu"></button>
  <button id="btn-export-json"></button><button id="btn-export-csv"></button></div>
<div class="modal" id="modal-ranking" hidden><div id="rank-tabs"></div><tbody id="rank-body"></tbody>
  <p id="rank-empty" hidden></p><button id="btn-rank-clear"></button><button id="btn-rank-close"></button></div>
<div class="modal" id="modal-howto" hidden><button id="btn-howto-close"></button></div>
<button id="btn-ranking"></button><button id="btn-howto"></button><input type="checkbox" id="chk-sound" checked>

<script src="../physics.js"></script>
<script src="../maps.js"></script>
<script src="../scoring.js"></script>
<script src="../feedback.js"></script>
<script src="../diagnose.js"></script>
<script src="../ranking.js"></script>
<script src="../sound.js"></script>
<script src="../renderer.js"></script>
<script src="../app.js"></script>
<script src="harness.js"></script>
<script>
'use strict';
// requestAnimationFrame을 즉시 실행으로 바꿔 애니메이션을 동기적으로 몰아친다.
window.requestAnimationFrame = function (fn) { setTimeout(function () { fn(16); }, 0); };

setTimeout(function () {
  T.describe('모듈 초기화');
  T.ok(!!window.__SF, 'app.js가 초기화되어 window.__SF를 노출한다');
  T.ok(!!window.Physics && !!window.Maps && !!window.Scoring, '순수 모듈이 모두 로드된다');

  T.describe('스테이지 모드 시작');
  var SF = window.__SF;
  SF.startMode('stage');
  SF.S.level = 3;
  SF.startGame();
  T.ok(document.getElementById('screen-game').classList.contains('active'), '게임 화면으로 전환된다');
  T.ok(SF.S.shotsLeft > 0, '발사 횟수가 설정된다 (' + SF.S.shotsLeft + ')');
  T.eq(SF.S.mapId, 1, 'Map 1부터 시작한다');

  T.describe('발사가 오류 없이 끝까지 돈다');
  var before = SF.S.shotsLeft;
  // 명중 조합을 찾아 직접 세팅 (calibrate가 보장한 해가 있다)
  var hit = null;
  for (var a = 40; a <= 78 && !hit; a += 2) {
    for (var p = 40; p <= 95; p += 2) {
      var c = Maps.buildCondition({ mapId: 1, level: 3, projectileId: 'round', angle: a, power: p });
      if (Physics.simulate(c).hit) { hit = { a: a, p: p }; break; }
    }
  }
  T.ok(hit !== null, 'Map 1에 명중 조합이 있다');
  SF.S.angle = hit.a; SF.S.power = hit.p;
  SF.fire();

  // rAF가 setTimeout으로 풀리므로 몇 틱 뒤 상태를 확인한다
  setTimeout(function () {
    T.ok(SF.S.shotsLeft < before, '발사 후 남은 횟수가 줄었다');
    T.ok(Ranking.getLogs().length > 0, '발사 로그가 기록되었다 (' + Ranking.getLogs().length + '건)');
    T.ok(SF.S.mapScores[0] > 0, '명중 후 맵 점수가 계산되었다 (' + SF.S.mapScores[0] + ')');

    T.describe('내보내기 형식');
    var csv = Ranking.toCSV();
    T.ok(csv.indexOf('session,nickname') === 0, 'CSV 헤더가 올바르다');
    T.ok(csv.split('\n').length >= 2, 'CSV에 데이터 행이 있다');
    var json = JSON.parse(Ranking.toJSON());
    T.ok(Array.isArray(json) && json.length > 0, 'JSON이 로그 배열로 파싱된다');

    T.describe('랭킹 등록·조회');
    Ranking.clear();
    Ranking.submit({ nickname: '테스트왕', mode: 'stage', difficulty: 3, totalScore: 5000, clearedMaps: 5, totalShots: 20, bestAccuracy: 88 });
    Ranking.submit({ nickname: '홍길동<script>', mode: 'stage', difficulty: 2, totalScore: 8000, clearedMaps: 5, totalShots: 15, bestAccuracy: 95 });
    var list = Ranking.list('stage');
    T.eq(list.length, 2, '스테이지 랭킹에 2건이 있다');
    T.eq(list[0].totalScore, 8000, '점수 내림차순으로 정렬된다');
    T.ok(list[1].nickname.indexOf('<') === -1, '닉네임에서 위험 문자가 제거된다 (' + list[1].nickname + ')');
    T.eq(Ranking.list('challenge').length, 0, '챌린지 탭에는 스테이지 기록이 섞이지 않는다 (개발 계획서 0.3)');
    Ranking.clear();
    Ranking.clearLogs();

    T.report();
  }, 2500);
}, 100);
</script>
</body>
</html>
